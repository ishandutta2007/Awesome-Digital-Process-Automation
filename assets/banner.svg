<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" style="background:#0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Card Glassmorphism -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Animated Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    .flowing-path {
      stroke-dasharray: 12, 12;
      animation: flowLine 3s linear infinite;
    }
    .particle {
      animation: floatParticle 4s ease-in-out infinite;
    }
    .glow-circle {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite;
    }
  </style>

  <!-- Base Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Background Ambient Animated Circles (Placed safely behind cards & text) -->
  <circle cx="150" cy="80" r="180" fill="#4f46e5" opacity="0.15" filter="url(#glow)" class="glow-circle"/>
  <circle cx="1050" cy="280" r="200" fill="#9333ea" opacity="0.15" filter="url(#glow)" class="glow-circle" style="animation-delay: -3s;"/>

  <!-- Background Dynamic Flow Lines -->
  <path d="M 50 300 Q 300 200 600 300 T 1150 200" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3" class="flowing-path"/>
  <path d="M 50 100 Q 400 250 800 100 T 1150 150" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.2" class="flowing-path" style="animation-duration: 5s;"/>

  <!-- Ambient Floating Particles -->
  <circle cx="200" cy="120" r="3" fill="#a855f7" class="particle"/>
  <circle cx="450" cy="70" r="4" fill="#6366f1" class="particle" style="animation-delay: -1s;"/>
  <circle cx="850" cy="290" r="3.5" fill="#ec4899" class="particle" style="animation-delay: -2s;"/>
  <circle cx="1000" cy="100" r="2.5" fill="#38bdf8" class="particle" style="animation-delay: -1.5s;"/>

  <!-- Foreground Container (Text and Badges placed cleanly in front) -->
  <g transform="translate(60, 45)">
    <!-- Main Title Badge / Category -->
    <rect x="0" y="0" width="340" height="32" rx="16" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
    <text x="16" y="21" fill="#a5b4fc" font-size="13" font-weight="600" letter-spacing="1">⚡ CURATED AUTOMATION ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-size="40" font-weight="800" letter-spacing="-0.5">Awesome Digital Process Automation</text>

    <!-- Accent Underline Banner Line -->
    <rect x="0" y="110" width="680" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Subtitle / Focus Statement -->
    <text x="0" y="145" fill="#94a3b8" font-size="17" font-weight="400">
      Enterprise SaaS &amp; Open-Source Workflow Engines • BPMN • Low-Code Orchestration
    </text>

    <!-- Feature Cards / Badges in Foreground -->
    <g transform="translate(0, 180)">
      <!-- Card 1: Enterprise SaaS -->
      <g transform="translate(0, 0)">
        <rect width="210" height="64" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
        <text x="16" y="26" fill="#38bdf8" font-size="12" font-weight="700">ENTERPRISE SAAS</text>
        <text x="16" y="46" fill="#e2e8f0" font-size="13" font-weight="500">ServiceNow • Appian • Pega</text>
      </g>

      <!-- Card 2: Open Source Stack -->
      <g transform="translate(230, 0)">
        <rect width="220" height="64" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
        <text x="16" y="26" fill="#a855f7" font-size="12" font-weight="700">OPEN-SOURCE STACK</text>
        <text x="16" y="46" fill="#e2e8f0" font-size="13" font-weight="500">Camunda • Flowable • n8n</text>
      </g>

      <!-- Card 3: Standards -->
      <g transform="translate(465, 0)">
        <rect width="210" height="64" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
        <text x="16" y="26" fill="#ec4899" font-size="12" font-weight="700">STANDARDS &amp; AI</text>
        <text x="16" y="46" fill="#e2e8f0" font-size="13" font-weight="500">BPMN 2.0 • CMMN • DMN</text>
      </g>
    </g>
  </g>
</svg>
